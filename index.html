<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Sussex Accessible Routes (MVP)</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="topbar">
    <h1>Sussex Accessible Routes</h1>

    <div class="toggles">
      <label class="toggle">
        <input id="routesToggle" type="checkbox" checked />
        Show accessible route overlays
      </label>

      <label class="toggle">
        <input id="poisToggle" type="checkbox" checked />
        Show POIs (Points of Interest)
      </label>

      <button
        id="sidebarToggle"
        class="sidebar-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="sidebar"
      >
        ☰ Info
      </button>
    </div>
  </header>

  <main class="layout">
    <section
      id="map"
      aria-label="Accessible campus route map"
    ></section>

    <aside id="sidebar" class="sidebar">
      <section
        class="route-planner"
        aria-labelledby="routePlannerHeading"
      >
        <h2 id="routePlannerHeading">Plan a route</h2>

        <label for="routeFrom">From</label>

        <select id="routeFrom">
          <option value="">Choose a starting point</option>
        </select>

        <label for="routeTo">To</label>

        <select id="routeTo">
          <option value="">Choose a destination</option>
        </select>

        <label class="toggle">
          <input id="stepFreeOnly" type="checkbox" checked />
          Step-free routes only
        </label>

        <button id="findRouteButton" type="button">
          Find accessible route
        </button>

        <div
          id="routeResult"
          class="route-result"
          role="status"
          aria-live="polite"
        ></div>
      </section>

      <hr />

      <h3>Legend</h3>

      <div class="legend">
        <div class="legend-item">
          <img
            src="./icons/lift.svg"
            alt=""
            class="legend-icon"
          />
          <span>Lift</span>
        </div>

        <div class="legend-item">
          <img
            src="./icons/main_accessible_entrance.svg"
            alt=""
            class="legend-icon"
          />
          <span>Main accessible entrance</span>
        </div>

        <div class="legend-item">
          <img
            src="./icons/specific_accessible_entrance.svg"
            alt=""
            class="legend-icon"
          />
          <span>Specific accessible entrance</span>
        </div>

        <div class="legend-item">
          <img
            src="./icons/main_entrance.svg"
            alt=""
            class="legend-icon"
          />
          <span>Main entrance</span>
        </div>
      </div>

      <hr />

      <h3>POI filters</h3>

      <div class="filters">
        <label class="toggle">
          <input id="filterLift" type="checkbox" checked />
          Lifts
        </label>

        <label class="toggle">
          <input
            id="filterMainAccEntrance"
            type="checkbox"
            checked
          />
          Main accessible entrances
        </label>

        <label class="toggle">
          <input
            id="filterSpecificAccEntrance"
            type="checkbox"
            checked
          />
          Specific accessible entrances
        </label>

        <label class="toggle">
          <input
            id="filterMainEntrance"
            type="checkbox"
            checked
          />
          Main entrances
        </label>
      </div>

      <hr />

      <h3>Next steps</h3>

      <ul>
        <li>Add more predefined routes and POIs.</li>
        <li>Add route details such as gradient and surface.</li>
        <li>Later, turn route segments into a routable network.</li>
      </ul>
    </aside>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="./app.js"></script>
</body>
</html>
